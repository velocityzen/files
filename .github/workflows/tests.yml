name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test-macos:
    name: Run macOS Tests
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      # A test process or `files` run that crashes shows only its signal in the log; its
      # crash report has the stack. ReportCrash writes it a moment after the crash.
      - name: Show crash reports
        if: failure()
        run: |
          sleep 10
          shopt -s nullglob
          for report in ~/Library/Logs/DiagnosticReports/{swiftpm-testing-helper,FilesPackageTests,files}*.ips; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done

  test-linux:
    name: Run Linux Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Swift
        run: |
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf swiftly-$(uname -m).tar.gz
          ./swiftly init --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          hash -r

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
