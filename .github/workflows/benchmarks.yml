name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  compare:
    name: Compare Benchmarks
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The commit to compare with is benchmarked too, so fetch history.
          fetch-depth: 0

      # Same Xcode as tests.yml: Swift 6.3.3 and the macOS 26 SDK.
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Swift version
        run: swift --version

      # A pull request is compared with its base branch, a push with the commit it was
      # pushed on top of. There is nothing to compare with when that commit is unknown (a
      # new branch, a force push) or predates the benchmarks.
      - name: Find the commit to compare with
        id: commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:Benchmarks/Package.swift" 2>/dev/null; then
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "No benchmarks at the base commit to compare with." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The cut benchmarks need Core Audio, which SwiftPM's plugin sandbox blocks, so they
      # are left out here; add --disable-sandbox to both runs to include them.
      - name: Benchmark the base commit
        if: steps.commits.outputs.base != ''
        working-directory: Benchmarks
        env:
          BASE: ${{ steps.commits.outputs.base }}
          HEAD: ${{ steps.commits.outputs.head }}
        run: |
          git checkout --quiet --force --detach "$BASE"
          swift package --allow-writing-to-package-directory benchmark baseline update base --no-progress --quiet
          git checkout --quiet --force --detach "$HEAD"

      - name: Benchmark this commit
        working-directory: Benchmarks
        run: |
          swift package --allow-writing-to-package-directory benchmark baseline update head --no-progress --quiet

      - name: Report results
        if: steps.commits.outputs.base == ''
        working-directory: Benchmarks
        run: |
          swift package benchmark baseline read head --format markdown --no-progress >> "$GITHUB_STEP_SUMMARY"

      - name: Report changes
        if: steps.commits.outputs.base != ''
        working-directory: Benchmarks
        run: |
          {
            echo "<details><summary>Every metric, base commit vs this commit</summary>"
            echo
            swift package benchmark baseline compare base head --format markdown --no-progress
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Fails only on the metrics the benchmarks give thresholds to: malloc,
      # object-allocation, retain and release counts. Times on a shared runner are too
      # noisy to fail on and are only reported above.
      - name: Check for allocation and ARC regressions
        if: steps.commits.outputs.base != ''
        working-directory: Benchmarks
        run: |
          echo "## Allocation and ARC count changes" >> "$GITHUB_STEP_SUMMARY"
          status=0
          swift package benchmark baseline check base head --format markdown --no-progress \
              > "$RUNNER_TEMP/check.md" 2> "$RUNNER_TEMP/check.err" || status=$?
          cat "$RUNNER_TEMP/check.md" >> "$GITHUB_STEP_SUMMARY"
          # The counts that crossed a threshold go to the log too, so a failure reads
          # without opening the summary.
          cat "$RUNNER_TEMP/check.md"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          cat "$RUNNER_TEMP/check.err" >&2
          # SwiftPM reports every plugin failure as exit status 1, so tell an improvement,
          # which passes, from a regression or an error by the error the plugin names.
          if grep -q "benchmarkThresholdImprovement" "$RUNNER_TEMP/check.err"; then
            exit 0
          fi
          exit 1
